services:
  - type: web
    name: studymind-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://nightrider99.github.io
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
